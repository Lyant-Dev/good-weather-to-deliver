<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Good Weather to Deliver</title>
    <!-- =============== STYLE CSS ============= -->
    <link rel="stylesheet" href="style/style.css" />
  </head>
  <body>
    <h1 class="title">Good Weather to Deliver</h1>
    <div class="card-container">
      <div class="loading-container">
        <h2 id="loading-status">MEMUAT CUACA</h2>
      </div>
      <div class="error-container">
        <h2 id="error-status">GAGAL MEMUAT CUACA</h2>
      </div>
      <div class="icon-container">
        <div class="weather-icon" id="weather-icon">&#9729;</div>
      </div>
      <div class="data-container">
        <div class="weather-data">
          <h2 class="weather-condition" id="weather-condition">
            Cloudy / Berawan
          </h2>
          <span class="weather-degree" id="weather-degree">28℃</span>
        </div>
      </div>
      <div class="status-container">
        <div class="weather-status">
          <h2 class="status-info" id="status-info">✅ Aman</h2>
          <p class="status-delivery" id="status-delivery">
            Cuaca mendukung, pengiriman bisa tepat waktu
          </p>
        </div>
      </div>
    </div>

    <!-- ============= APP JS ===========  -->
    <script src="app/app.js"></script>
  </body>
</html>
