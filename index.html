<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Good Weather to Deliver</title>
    <!-- =============== STYLE CSS ============= -->
    <link rel="stylesheet" href="style/style.css" />
  </head>
  <body>
    <div class="card-container">
      <div class="loading-container">
        <h2 id="loading-status">MEMUAT CUACA...</h2>
        <span class="loader"></span>
      </div>
      <div class="error-container">
        <h2 id="error-status">GAGAL MEMUAT CUACA :(</h2>
      </div>
      <div class="icon-container">
        <div class="weather-icon" id="weather-icon">&#9729;</div>
      </div>
      <div class="data-container">
        <div class="weather-data">
          <div class="location" id="location"></div>
          <span id="date-time" class="date-time"></span>
          <div class="weather-condition" id="weather-condition"></div>
          <div class="weather-desc" id="weather-desc"></div>
          <div class="temp" id="temp"></div>
          <div class="temp-feels" id="temp-feels"></div>
          <div class="wind-speed" id="wind-speed"></div>
        </div>
      </div>
      <div class="status-container" id="status-container">
        <div class="weather-status">
          <h2 class="status-info" id="status-info"></h2>
          <p class="status-delivery" id="status-delivery"></p>
        </div>
      </div>
    </div>

    <!-- ============= APP JS ===========  -->
    <script src="app/app.js"></script>
  </body>
</html>
